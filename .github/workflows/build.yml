name: Build APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: gradle/actions/setup-gradle@v3
        with: { gradle-version: 8.9 }
      - name: Zip ac
        run: |
          ZIP=$(find . -maxdepth 1 -iname '*.zip' | head -n1)
          rm -rf _src && mkdir _src
          unzip -oq "$ZIP" -d _src
          S=$(find _src -name settings.gradle.kts -not -path '*/__MACOSX/*' | head -n1)
          echo "PROJ=$(dirname "$S")" >> "$GITHUB_ENV"
      - name: Derle
        run: gradle assembleDebug
        working-directory: ${{ env.PROJ }}
      - uses: actions/upload-artifact@v4
        with:
          name: mykeyboard-apk
          path: ${{ env.PROJ }}/app/build/outputs/apk/debug/*.apk
